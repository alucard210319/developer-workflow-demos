<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Table Exporter</title>
    <style>
      body {
        min-width: 220px;
        margin: 0;
        padding: 12px;
        font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #ffffff;
      }

      button {
        width: 100%;
        border: 0;
        border-radius: 6px;
        padding: 10px 12px;
        color: #ffffff;
        background: #2563eb;
        cursor: pointer;
        font-weight: 600;
      }

      button:disabled {
        background: #94a3b8;
        cursor: wait;
      }

      #status {
        min-height: 18px;
        margin-top: 10px;
        color: #475569;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <button id="export">Export first table</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
